  <!--
    Two faces, and the split between them is the argument of the page.

    Spectral carries every sentence: a sharp, screen-drawn serif with enough
    contrast to hold a long technical paragraph without going grey, and it sits
    beside KaTeX's own face the way a journal's body text does, because that is
    the register this writing is in.

    Archivo carries everything that is a reading rather than a sentence: the
    name, the section marks, the dates, the scale rail, the numbers, and all the
    type inside the diagrams. It is a 19th-century American gothic redrawn for
    small sizes, so it stays exact at 10px inside an SVG where a humanist face
    would blur, and its tabular figures keep columns of measurements aligned.

    Prose in the serif, instrumentation in the grotesque. Nothing is set in a
    monospace, which is the reflex here and the wrong one: monospace says
    terminal, and none of this came out of a terminal.
  -->
