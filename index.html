<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Romir Malik | Data Scientist</title>
  <meta name="description"
    content="Portfolio of Romir Malik, Data Scientist specializing in Deep Learning, Robotics and Big Data." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: {
              DEFAULT: '#030305', // Almost black
              secondary: '#0A0A0C', // Slightly lighter
              tertiary: '#121216'
            },
            primary: {
              DEFAULT: '#3B82F6', // Electric Blue
              hover: '#2563EB',
              glow: 'rgba(59, 130, 246, 0.5)'
            },
            secondary: {
              DEFAULT: '#8B5CF6', // Purple
              glow: 'rgba(139, 92, 246, 0.5)'
            },
            text: {
              primary: '#F3F4F6', // Gray 100
              secondary: '#9CA3AF', // Gray 400
              muted: '#6B7280' // Gray 500
            }
          },
          fontFamily: {
            sans: ['"Inter"', 'sans-serif'],
            mono: ['"Fira Code"', 'monospace'],
          },
          backgroundImage: {
            'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
            'hero-glow': 'conic-gradient(from 180deg at 50% 50%, #3B82F6 0deg, #8B5CF6 180deg, #3B82F6 360deg)',
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    body {
      background-color: #030305;
      color: #F3F4F6;
      font-family: 'Inter', sans-serif;
    }

    /* Custom scrollbar - Minimal */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #030305;
    }

    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #555;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>

  }
}
</script>
</head>

</html>
